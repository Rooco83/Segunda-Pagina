<!DOCTYPE html>
<!--
  APP CARGA DE TICKETS · Interfaz (identidad Venue Brand Experience)
  Colores de marca: azul #00263E · naranja #F15A24 · gris #D9D8D6 · negro #212721
  Tipografía: Montserrat (alternativa web a Neutrif Pro).
-->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #00263E;
      --orange: #F15A24;
      --orange-dark: #d94e1c;
      --gray: #D9D8D6;
      --ink: #212721;
      --bg: #eef0f2;
      --line: #d7dbe0;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Montserrat', -apple-system, Roboto, Arial, sans-serif;
      margin: 0; background: var(--bg); color: var(--ink);
    }

    /* Header con identidad de marca */
    header { background: var(--navy); color: #fff; padding: 16px 18px; }
    .brand { display: flex; align-items: center; gap: 12px; max-width: 520px; margin: 0 auto; }
    .vlogo { height: 44px; width: auto; display: block; flex: 0 0 auto; }
    .app-name { font-weight: 700; font-size: 1.12rem; line-height: 1.1; }
    .app-sub { font-size: .68rem; opacity: .8; letter-spacing: .12em; text-transform: uppercase; margin-top: 2px; }

    main { padding: 18px 16px 32px; max-width: 520px; margin: 0 auto; }
    label { display: block; font-weight: 600; margin: 16px 0 6px; font-size: .9rem; color: var(--navy); }

    select, textarea, input {
      width: 100%; padding: 13px; border: 1px solid var(--line);
      border-radius: 12px; font-size: 1rem; background: #fff;
      font-family: inherit; color: var(--ink); transition: border-color .15s, box-shadow .15s;
    }
    select:focus, textarea:focus, input:focus {
      outline: none; border-color: var(--orange);
      box-shadow: 0 0 0 3px rgba(241,90,36,.15);
    }
    textarea { resize: vertical; min-height: 62px; }

    .foto-box {
      border: 2px dashed #aeb6bf; border-radius: 14px; padding: 20px;
      text-align: center; background: #fff; margin-top: 6px;
    }
    .foto-box img { max-width: 100%; border-radius: 10px; margin-top: 10px; }

    .btn {
      display: block; width: 100%; margin-top: 24px; padding: 16px;
      background: var(--orange); color: #fff; border: none; border-radius: 14px;
      font-family: inherit; font-size: 1.05rem; font-weight: 700; letter-spacing: .01em;
      box-shadow: 0 4px 14px rgba(241,90,36,.30); cursor: pointer; transition: background .15s, transform .05s;
    }
    .btn:active { background: var(--orange-dark); transform: translateY(1px); }
    .btn:disabled { background: #b8bcc0; box-shadow: none; }

    .hint { font-size: .8rem; color: #6b7280; margin-top: 4px; }

    .combo { position: relative; }
    .lista {
      border: 1px solid var(--line); border-radius: 12px; margin-top: 4px;
      max-height: 240px; overflow-y: auto; background: #fff; display: none;
      box-shadow: 0 6px 18px rgba(0,38,62,.10);
    }
    .lista.show { display: block; }
    .lista div { padding: 12px; border-bottom: 1px solid #eef1f4; cursor: pointer; }
    .lista div:last-child { border-bottom: none; }
    .lista div:hover, .lista div:active { background: #eaf1f6; }
    .elegido { font-size: .85rem; color: var(--navy); margin-top: 6px; font-weight: 600; display: none; }

    .card {
      background: #fff; border-radius: 14px; padding: 18px; margin-top: 20px;
      box-shadow: 0 2px 10px rgba(0,38,62,.10);
    }
    .ok { border-left: 5px solid #1e9e57; }
    .err { border-left: 5px solid #dc2626; }
    .card h3 { margin: 0 0 10px; color: var(--navy); }
    .dato { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #eef1f4; }
    .dato span:first-child { color: #6b7280; }
    .dato span:last-child { font-weight: 600; text-align: right; }
    .card a { color: var(--orange); font-weight: 600; text-decoration: none; }

    .spinner { display: none; text-align: center; margin-top: 18px; color: var(--navy); font-weight: 600; }
    footer { text-align: center; font-size: .7rem; color: #9aa2ab; padding: 8px 0 20px; letter-spacing: .08em; text-transform: uppercase; }
  </style>
</head>

      <div>
        <div class="app-name">Carga de Tickets</div>
        <div class="app-sub">Venue Brand Experience</div>
      </div>
    </div>
  </header>

  <main>
    <label for="ccoBuscar">Evento (CCO)</label>
    <div class="combo">
      <input id="ccoBuscar" placeholder="Escribí palabras clave para buscar…" autocomplete="off">
      <div id="ccoLista" class="lista"></div>
    </div>
    <div class="elegido" id="ccoElegido"></div>
    <input type="hidden" id="cco">

    <label for="cuenta">Cuenta</label>
    <select id="cuenta"><option>Cargando…</option></select>

    <label for="descripcion">Descripción del gasto</label>
    <textarea id="descripcion" placeholder="Qué es y de dónde viene el ticket…"></textarea>

    <label for="foto">Foto del comprobante</label>
    <div class="foto-box">
      <input type="file" id="foto" accept="image/*" capture="environment">
      <div class="hint">Sacá una foto o elegí una captura de la galería.</div>
      <img id="preview" style="display:none">
    </div>

    <button class="btn" id="guardar" onclick="guardar()">Guardar ticket</button>

    <div class="spinner" id="spinner">⏳ Leyendo el ticket con Gemini…</div>
    <div id="resultado"></div>
  </main>

  <footer>Venue Brand Experience</footer>

  <script>
    let imagenBase64 = null;
    let mimeType = null;
    let ccosAll = [];

    google.script.run.withSuccessHandler(llenarOpciones).getOpciones();

    function llenarOpciones(op) {
      ccosAll = op.ccos || [];
      const cuenta = document.getElementById('cuenta');
      cuenta.innerHTML = '<option value="">Elegí una cuenta…</option>';
      op.cuentas.forEach(function (v) { cuenta.add(new Option(v, v)); });
      document.getElementById('ccoBuscar').placeholder = 'Buscar entre ' + ccosAll.length + ' eventos…';
      if (op.avisoCco) {
        const e = document.getElementById('ccoElegido');
        e.textContent = '⚠️ ' + op.avisoCco;
        e.style.color = '#dc2626';
        e.style.display = 'block';
      }
    }

    const ccoBuscar = document.getElementById('ccoBuscar');
    const ccoLista = document.getElementById('ccoLista');

    ccoBuscar.addEventListener('input', function () {
      document.getElementById('cco').value = '';
      document.getElementById('ccoElegido').style.display = 'none';
      renderCco(ccoBuscar.value);
    });
    ccoBuscar.addEventListener('focus', function () { renderCco(ccoBuscar.value); });

    document.addEventListener('click', function (ev) {
      if (!ev.target.closest('.combo')) ccoLista.classList.remove('show');
    });

    function renderCco(q) {
      const tokens = q.toLowerCase().split(/\s+/).filter(Boolean);
      let res = ccosAll.filter(function (c) {
        const t = c.toLowerCase();
        return tokens.every(function (k) { return t.indexOf(k) > -1; });
      });
      const total = res.length;
      res = res.slice(0, 50);

      ccoLista.innerHTML = '';
      if (res.length === 0) { ccoLista.classList.remove('show'); return; }
      res.forEach(function (c) {
        const d = document.createElement('div');
        d.textContent = c;
        d.addEventListener('click', function () { elegirCco(c); });
        ccoLista.appendChild(d);
      });
      if (total > 50) {
        const info = document.createElement('div');
        info.style.color = '#6b7280';
        info.style.fontSize = '.8rem';
        info.textContent = 'Mostrando 50 de ' + total + '. Agregá más palabras para afinar.';
        ccoLista.appendChild(info);
      }
      ccoLista.classList.add('show');
    }

    function elegirCco(c) {
      document.getElementById('cco').value = c;
      ccoBuscar.value = c;
      const e = document.getElementById('ccoElegido');
      e.textContent = '✓ ' + c;
      e.style.display = 'block';
      ccoLista.classList.remove('show');
    }

    document.getElementById('foto').addEventListener('change', function (e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (ev) {
        const img = new Image();
        img.onload = function () {
          const maxLado = 1600;
          let { width, height } = img;
          if (width > maxLado || height > maxLado) {
            const escala = maxLado / Math.max(width, height);
            width = Math.round(width * escala);
            height = Math.round(height * escala);
          }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
          imagenBase64 = dataUrl.split(',')[1];
          mimeType = 'image/jpeg';
          const p = document.getElementById('preview');
          p.src = dataUrl; p.style.display = 'block';
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    function guardar() {
      const cco = document.getElementById('cco').value;
      const cuenta = document.getElementById('cuenta').value;
      const descripcion = document.getElementById('descripcion').value;

      if (!cco) { alert('Elegí un evento (CCO).'); return; }
      if (!cuenta) { alert('Elegí una cuenta.'); return; }
      if (!imagenBase64) { alert('Falta la foto del comprobante.'); return; }

      document.getElementById('guardar').disabled = true;
      document.getElementById('spinner').style.display = 'block';
      document.getElementById('resultado').innerHTML = '';

      google.script.run
        .withSuccessHandler(mostrarResultado)
        .withFailureHandler(mostrarError)
        .procesarTicket({
          cco: cco,
          cuenta: cuenta,
          descripcion: descripcion,
          imagenBase64: imagenBase64,
          mimeType: mimeType
        });
    }

    function mostrarResultado(r) {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('guardar').disabled = false;

      if (!r.ok) { return mostrarError({ message: r.error }); }

      document.getElementById('resultado').innerHTML =
        '<div class="card ok">' +
          '<h3>✅ Ticket #' + r.orden + ' guardado</h3>' +
          fila('Proveedor', r.proveedor || '—') +
          fila('Fecha', r.fecha || '—') +
          fila('Importe', (r.importe || '—') + ' ' + (r.moneda || '')) +
          (r.estado && r.estado !== 'OK' ? '<p class="hint">⚠️ ' + r.estado + '</p>' : '') +
          (r.carpetaRuta ? '<p class="hint">📍 ' + r.carpetaRuta + '</p>' : '') +
          (r.carpetaUrl ? '<p><a href="' + r.carpetaUrl + '" target="_blank">📁 Abrir carpeta</a> &nbsp;·&nbsp; <a href="' + r.hojaUrl + '" target="_blank">📄 Abrir planilla</a></p>' : '') +
        '</div>';

      document.getElementById('descripcion').value = '';
      document.getElementById('foto').value = '';
      document.getElementById('preview').style.display = 'none';
      imagenBase64 = null;
    }

    function mostrarError(e) {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('guardar').disabled = false;
      document.getElementById('resultado').innerHTML =
        '<div class="card err"><h3>❌ Hubo un problema</h3><p>' + (e.message || e) + '</p></div>';
    }

    function fila(k, v) {
      return '<div class="dato"><span>' + k + '</span><span>' + v + '</span></div>';
    }
  </script>
</body>
</html>
